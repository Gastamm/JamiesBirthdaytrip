<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Beaufort Birthday Adventure</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Lato', sans-serif;
            margin: 0;
            background: #ffffff;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url('images/marina-wood.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.25;
            z-index: -1;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 12px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            margin-bottom: 10px;
            text-align: center;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            margin-top: 40px;
            font-size: 28px;
        }

        .section {
            margin-bottom: 25px;
        }

        .label {
            font-weight: bold;
            font-size: 18px;
        }

        .value {
            font-size: 18px;
            margin-left: 6px;
        }

        .btn-row {
            margin-top: 40px;
            text-align: center;
        }

        .btn {
            padding: 12px 22px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin: 10px;
        }

        .print-btn {
            background: #2a5dff;
            color: white;
        }

        .restart-btn {
            background: #444;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Here Is Your Curated Beaufort Birthday Adventure</h1>

        <!-- ARRIVAL -->
        <h2>Arrival</h2>
        <div class="section">
            <div><span class="label">Arrival Vibe:</span> <span id="arrival"></span></div>
            <div><span class="label">Arrival Drinks:</span> <span id="arrival_drinks"></span></div>
        </div>

        <!-- DAY 1 DINNER -->
        <h2>Birthday Dinner (Day 1)</h2>
        <div class="section">
            <div><span class="label">Dinner:</span> <span id="dinner"></span></div>
        </div>

        <!-- DAY 2 -->
        <h2>Day 2</h2>
        <div class="section">
            <div><span class="label">Breakfast:</span> <span id="day2-breakfast"></span></div>
            <div><span class="label">Morning Activity:</span> <span id="day2-morning"></span></div>
            <div><span class="label">Lunch:</span> <span id="day2-lunch"></span></div>
            <div><span class="label">Afternoon Exploration:</span> <span id="day2-afternoon"></span></div>
            <div><span class="label">Dinner:</span> <span id="day2-dinner"></span></div>
            <div><span class="label">Drinks:</span> <span id="day2-drinks"></span></div>
        </div>

        <!-- DAY 3 -->
        <h2>Day 3</h2>
        <div class="section">
            <div><span class="label">Breakfast:</span> <span id="day3-breakfast"></span></div>
            <div><span class="label">Midday Path:</span> <span id="day3-midday"></span></div>
            <div><span class="label">Lunch:</span> <span id="day3-lunch"></span></div>
            <div><span class="label">Afternoon:</span> <span id="day3-afternoon"></span></div>
        </div>

        <div class="btn-row">
            <button class="btn print-btn" onclick="window.print()">Download / Print</button>
            <button class="btn restart-btn" onclick="window.location.href='index.html'">Start Over</button>
        </div>
    </div>

    <script>
        // These are ALL the keys your other pages actually save.
        const fields = [
            'arrival',
            'arrival_drinks',
            'dinner',

            'day2-breakfast',
            'day2-morning',
            'day2-lunch',
            'day2-afternoon',
            'day2-dinner',
            'day2-drinks',

            'day3-breakfast',
            'day3-midday',
            'day3-lunch',
            'day3-afternoon'
        ];

        fields.forEach(key => {
            const value = localStorage.getItem(key);
            const element = document.getElementById(key);

            if (element) {
                element.textContent = value ? value : "Not selected";
            }
        });
    </script>
</body>
</html>
