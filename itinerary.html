<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Beaufort Birthday Adventure</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Lato', sans-serif;
            margin: 0;
            background: #ffffff;
        }

        /* BEACH BACKGROUND */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url('images/faint-beach-texture.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.30; /* stronger so it's clearly visible */
            filter: blur(1.5px);
            z-index: -1;
        }

        /* FLOATING CARD CONTAINER */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 40px;

            background: rgba(255, 255, 255, 0.78); /* lets background show through */
            border-radius: 14px;

            box-shadow:
                0 8px 24px rgba(0,0,0,0.12),
                0 4px 12px rgba(0,0,0,0.08);

            backdrop-filter: blur(3px); /* coastal modern glass effect */
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            margin-bottom: 10px;
            text-align: center;
            color: #003049;
            letter-spacing: 0.5px;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            margin-top: 40px;
            font-size: 28px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(0,0,0,0.15);
            padding-bottom: 6px;
            color: #003049;
        }

        .section {
            margin-bottom: 25px;
            padding-bottom: 20px;
        }

        .section div {
            margin: 12px 0;
        }

        .label {
            font-weight: 600;
            font-size: 18px;
            color: #003049;
        }

        .value {
            font-size: 18px;
            margin-left: 6px;
            color: #1a1a1a;
        }

        .btn-row {
            margin-top: 40px;
            text-align: center;
        }

        .btn {
            padding: 12px 22px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin: 10px;
        }

        .print-btn {
            background: #2a5dff;
            color: white;
        }

        .restart-btn {
            background: #444;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Your Curated Beaufort Birthday Adventure</h1>

        <!-- DAY 1 DINNER -->
        <h2>Birthday Dinner (Day 1)</h2>
        <div class="section">
            <div><span class="label">Dinner:</span> <span id="dinner-drinks-dinner" class="value"></span></div>
            <div><span class="label">Drinks:</span> <span id="dinner-drinks-drinks" class="value"></span></div>
        </div>

        <!-- DAY 2 -->
        <h2>Day 2</h2>
        <div class="section">
            <div><span class="label">Breakfast:</span> <span id="day2-breakfast" class="value"></span></div>
            <div><span class="label">Morning Activity:</span> <span id="day2-morning" class="value"></span></div>
            <div><span class="label">Lunch:</span> <span id="day2-lunch" class="value"></span></div>
            <div><span class="label">Afternoon Exploration:</span> <span id="day2-afternoon" class="value"></span></div>
            <div><span class="label">Dinner:</span> <span id="day2-dinner" class="value"></span></div>
            <div><span class="label">Drinks:</span> <span id="day2-drinks" class="value"></span></div>
        </div>

        <!-- DAY 3 -->
        <h2>Day 3</h2>
        <div class="section">
            <div><span class="label">Breakfast:</span> <span id="day3-breakfast" class="value"></span></div>
            <div><span class="label">Midday Path:</span> <span id="day3-midday" class="value"></span></div>
            <div><span class="label">Lunch:</span> <span id="day3-lunch" class="value"></span></div>
            <div><span class="label">Afternoon:</span> <span id="day3-afternoon" class="value"></span></div>
        </div>

        <div class="btn-row">
            <button class="btn print-btn" onclick="window.print()">Download / Print</button>
            <button class="btn restart-btn" onclick="window.location.href='index.html'">Start Over</button>
        </div>
    </div>

    <script>
        const fields = [
            'dinner-drinks-dinner',
            'dinner-drinks-drinks',

            'day2-breakfast',
            'day2-morning',
            'day2-lunch',
            'day2-afternoon',
            'day2-dinner',
            'day2-drinks',

            'day3-breakfast',
            'day3-midday',
            'day3-lunch',
            'day3-afternoon'
        ];

        fields.forEach(key => {
            const value = localStorage.getItem(key);
            const element = document.getElementById(key);

            if (element) {
                element.textContent = value ? value : "Not selected";
            }
        });
    </script>
</body>
</html>
